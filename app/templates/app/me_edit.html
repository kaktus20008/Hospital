{% extends "app/base.html" %}
{% block title %}ИЗМЕНИТЬ ДАННЫЕ{% endblock %}
{% block topbar %}
<div class="topbar">
  <a class="brand" href="{% url 'home' %}" title="На главную">←</a>
  <div class="spacer"></div><div class="spacer"></div>
</div>
{% endblock %}
{% block content %}
<form method="post">
  {% csrf_token %}
  <label>Фамилия</label>
  <input name="lname" value="{{ p.lname }}" required>
  <label>Имя</label>
  <input name="fname" value="{{ p.fname }}" required>
  <label>Отчество</label>
  <input name="mname" value="{{ p.mname|default:'' }}">
  <label>Телефон</label>
  <input name="phone" value="{{ p.phone }}" maxlength="12" required>
  <label>Адрес</label>
  <input name="adress" value="{{ p.adress }}" required>
  <label>Почта</label>
  <input name="email" type="email" value="{{ p.email }}" required>
  <label>Пол</label>
  <select name="gender">
    <option value="1" {% if p.idgender_id == 1 %}selected{% endif %}>Мужской</option>
    <option value="2" {% if p.idgender_id == 2 %}selected{% endif %}>Женский</option>
  </select>
  <div class="btn-row">
    <a class="btn" href="{% url 'me' %}">НАЗАД</a>
    <button class="btn" type="submit">СОХРАНИТЬ</button>
  </div>
</form>
{% endblock %}
